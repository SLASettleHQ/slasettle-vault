[package]
name = "sla-vault"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
watcher-registry = { path = "../watcher_registry" }

[features]
testutils = ["soroban-sdk/testutils"]
