[workspace]
resolver = "2"
members = [
    "contracts/watcher_registry",
    "contracts/sla_vault",
]

[workspace.dependencies]
soroban-sdk = "29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
